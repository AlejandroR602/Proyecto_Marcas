    <form action="" name="REGISTRO" autocomplete="off">
        <div class="Persona">
            <legend class="legend">Registrese</legend>
            Nombre:
            <input type="text" name="Nombre" placeholder="Gant">
            <br>
            Apellidos:
            <input type="text" name="Apellidos" placeholder="BOLL">
            <br>
            DNI:
            <input type="text" name="DNI" placeholder="ej: 12345678A">
            <br>
            Calle:
            <input type="text" name="Calle" placeholder="Av/Del atlante 3">
            <br>
            Telefono:
            <input type="tel" name="Telefono" placeholder="596312447">
            <br>
            Sexo:
            <label>
                <input type="radio" name="genero" value="1"> Hombre
            </label>
            <label>
                <input type="radio" name="genero" value="2"> Mujer 
            </label>
            <br>
            <label>Contraseña:<input type="password" name="password" placeholder="Contraseña" required></label>
            <label>Repita Contraseña:<input type="password" name="password" placeholder="Contraseña Repetida" required></label>
            <br>
            <label>
                Fecha de nacimiento:
                <input type="date" name="Nacimiento" required>
            </label>
            <br>
            Correo Electronico:
            <input type="email" placeholder="XXXXX@gmail.com">
        </div>
    </form>
